version: '3.8'
services: 
  rabbitmq: 
    image: rabbitmq:3-management
    ports:
    - "5672:5672"
    - "15672:15672"
  
  redis:
    image: redis:7
    ports:
    - "6379:6379"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"